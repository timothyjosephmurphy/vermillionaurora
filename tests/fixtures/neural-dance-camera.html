<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Camera preview fixture</title>
<style>
  body { margin: 0; background: #07080c; color: #fff; font-family: sans-serif; }
  .camera-frame { position: relative; width: 640px; height: 360px; background: #05060a; }
  [data-preview], [data-overlay] { position: absolute; inset: 0; width: 100%; height: 100%; }
  button, select { font: inherit; }
</style>
</head>
<body>
<section id="nd-room-lab">
  <button type="button" data-action="play">Start</button>
</section>
<section id="nd-camera-mode">
  <button class="btn btn-primary" type="button" data-action="camera">Use camera</button>
  <button type="button" data-action="refresh">Refresh cameras</button>
  <button type="button" data-action="calibrate" aria-pressed="false">Calibrate wall</button>
  <button type="button" data-action="markers" aria-pressed="false" disabled>Markers off</button>
  <label>Camera<select data-control="device" aria-label="Camera"><option value="">Choose a camera</option></select></label>
  <label>Hue tolerance <output data-value="hue">28°</output><input data-control="hue" type="range" min="5" max="80" step="1" value="28"></label>
  <label>Saturation sensitivity <output data-value="sat">0.55</output><input data-control="sat" type="range" min="0" max="1" step="0.01" value="0.55"></label>
  <label>Minimum blob size <output data-value="size">18 px</output><input data-control="size" type="range" min="4" max="200" step="1" value="18"></label>
  <div class="camera-frame"><video data-preview autoplay muted playsinline></video><canvas data-overlay></canvas></div>
  <p data-status>Camera off</p>
</section>
<script>
document.getElementById('nd-room-lab').neuralDance = {
  setMarkers(list) { window.__markers = list; return list; },
  poke() { window.__pokes = (window.__pokes || 0) + 1; }
};
</script>
<script type="module" src="/neural-dance/camera-markers.js"></script>
</body>
</html>
