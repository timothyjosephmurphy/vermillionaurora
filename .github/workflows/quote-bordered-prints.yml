name: Quote bordered print editions (read-only)
on:
  push:
    branches: [print-half-inch-border]
    paths: ['payments/quote-bordered-prints.mjs', '.github/workflows/quote-bordered-prints.yml']
permissions:
  contents: read
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Deploy isolated sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Retrieve exact-size bordered retail prices without placing orders
        if: "!contains(github.event.head_commit.message, '[shipping-quote]')"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node payments/quote-bordered-prints.mjs
      - name: Quote one test print with shipping and tax without ordering
        if: contains(github.event.head_commit.message, '[shipping-quote]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node payments/quote-bordered-prints.mjs --shipping=paul-murphy-painting-64/small
