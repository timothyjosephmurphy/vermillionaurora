name: Verify isolated checkout sandbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-checkout-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check sandbox stock and shipping tax quote
        run: |
          base=https://vermillion-checkout-sandbox.timothyjosephmurphy.workers.dev
          status=$(curl --silent --show-error --output /tmp/checkout-status.json --write-out '%{http_code}' \
            "$base/checkout/status?slug=honeybadger-and-cub-with-genesis-block")
          echo "Checkout status HTTP $status"
          cat /tmp/checkout-status.json
          test "$status" = 200
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/checkout-status.json'));if(s.status!=='available')process.exit(1)"
          status=$(curl --silent --show-error --output /tmp/checkout-quote.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"slug":"honeybadger-and-cub-with-genesis-block","address":{"name":"Test Buyer","street1":"1600 Amphitheatre Pkwy","city":"Mountain View","state":"CA","zip":"94043"}}' \
            "$base/checkout/quote")
          echo "Checkout quote HTTP $status"
          cat /tmp/checkout-quote.json
          test "$status" = 200
          node -e "const q=JSON.parse(require('fs').readFileSync('/tmp/checkout-quote.json'));if(!q.total||!q.shipping||!q.tax)process.exit(1)"
