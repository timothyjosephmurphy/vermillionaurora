name: Check shipping configuration

on:
  push:
    branches: [shippo-label-email]

permissions:
  contents: read

jobs:
  read-shipping-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/shippo-label-email'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipping settings without reading secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/check-shipping-config.mjs
