name: Test checkout shipping notifications

on:
  push:
    branches: [shippo-label-email, shared-paypal-checkout, main]
    paths: ['cloudflare/**', '.github/workflows/test-shipping.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/test-shipping.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/test/package-lock.json
      - run: node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs cloudflare/checkout-recovery.test.mjs
      - run: npm --prefix cloudflare/test ci
      - run: npm --prefix cloudflare/test test
  read-shipping-config:
    if: github.event_name == 'push' && github.ref == 'refs/heads/shippo-label-email'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shipping settings without reading secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/check-shipping-config.mjs
