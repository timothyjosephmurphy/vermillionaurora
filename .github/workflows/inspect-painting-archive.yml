name: Inspect painting archive
on:
  push:
    branches: [codex/archived-paintings]
    paths:
      - '.github/workflows/inspect-painting-archive.yml'
      - 'scripts/archive-reader/**'
      - 'scripts/export-painting-archive.mjs'
      - 'scripts/preview-painting-archive.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: painting-archive-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-archive]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Confirm the existing media credential is configured
        env:
          MEDIA_TOKEN: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
        run: test -n "$MEDIA_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoders
        run: python -m pip install Pillow pillow-heif
      - name: Deploy authenticated read-only archive reader
        id: reader
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          command: deploy --config scripts/archive-reader/wrangler.jsonc
      - name: Export archive inventory and review previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
        run: node scripts/export-painting-archive.mjs
      - name: Remove temporary reader
        if: always() && steps.reader.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
        run: node scripts/export-painting-archive.mjs --cleanup
      - name: Create review contact sheets
        if: success()
        run: python scripts/preview-painting-archive.py --sheets .cache/painting-archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painting-archive-review
          path: .cache/painting-archive/
          retention-days: 3
          if-no-files-found: ignore
