name: Deploy isolated checkout sandbox
on:
  push:
    branches: [main, shared-paypal-checkout]
    paths:
      - 'cloudflare/**'
      - 'payments/verify-sandbox.mjs'
      - 'payments/check-production-config.mjs'
      - '.github/workflows/deploy-checkout-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkout and catalog
        run: |
          node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs cloudflare/checkout-recovery.test.mjs
          node payments/build-checkout-catalog.mjs
          git diff --exit-code -- cloudflare/checkout-catalog.mjs
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.sandbox.jsonc'));if(c.name!=='vermillion-checkout-sandbox'||c.vars.PAYPAL_MODE!=='sandbox'||c.vars.PAYPAL_CHECKOUT_ENABLED!=='true'||c.main!=='checkout-sandbox.mjs')process.exit(1)"
      - name: Build production Worker without deploying
        run: |
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc'));if(c.name!=='vermillion-commissions'||c.vars.PAYPAL_MODE!=='live'||!['false','true'].includes(c.vars.PAYPAL_CHECKOUT_ENABLED))process.exit(1)"
          npx --yes wrangler@4.143.0 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/production-worker
      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc
      - name: Confirm real sandbox webhook delivery and tax record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/verify-sandbox.mjs
  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/check-production-config.mjs
