name: Deploy isolated checkout sandbox

on:
  push:
    branches: [shared-paypal-checkout]
    paths:
      - cloudflare/checkout-sandbox.mjs
      - cloudflare/checkout-catalog.mjs
      - cloudflare/checkout-pricing.mjs
      - cloudflare/paypal-orders.mjs
      - cloudflare/painting-stock.mjs
      - cloudflare/paypal-inventory.mjs
      - cloudflare/wrangler.sandbox.jsonc
      - .github/workflows/deploy-checkout-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sandbox isolation and checkout tests
        run: |
          node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.sandbox.jsonc')); if(c.name!=='vermillion-checkout-sandbox'||c.vars.PAYPAL_MODE!=='sandbox'||c.vars.PAYPAL_CHECKOUT_ENABLED!=='true'||c.main!=='checkout-sandbox.mjs') process.exit(1)"
      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc
      - name: Verify sandbox endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 --silent --show-error \
            https://vermillion-checkout-sandbox.timothyjosephmurphy.workers.dev/checkout/health \
            | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const h=JSON.parse(s);if(h.mode!=='sandbox'||h.enabled!==true)process.exit(1);console.log('Sandbox endpoint enabled')})"
