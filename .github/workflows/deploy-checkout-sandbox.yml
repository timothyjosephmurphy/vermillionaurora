name: Deploy isolated checkout sandbox

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-checkout-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-paypal-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sandbox isolation and checkout tests
        run: |
          node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.sandbox.jsonc')); if(c.name!=='vermillion-checkout-sandbox'||c.vars.PAYPAL_MODE!=='sandbox'||c.vars.PAYPAL_CHECKOUT_ENABLED!=='true'||c.main!=='checkout-sandbox.mjs') process.exit(1)"
      - name: Check scoped Worker metadata access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          base=https://api.cloudflare.com/client/v4/accounts/3c1fddf0f4f4fc9c84594757d2e1bda0
          for path in \
            workers/services/vermillion-checkout-sandbox/environments/production/bindings \
            'workers/services/vermillion-checkout-sandbox/environments/production/routes?show_zonename=true' \
            'workers/domains/records?page=0&per_page=5&service=vermillion-checkout-sandbox&environment=production' \
            workers/services/vermillion-checkout-sandbox/environments/production/subdomain \
            workers/services/vermillion-checkout-sandbox/environments/production \
            workers/scripts/vermillion-checkout-sandbox/schedules
          do
            status=$(curl --silent --show-error --output /tmp/cf-probe.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$path")
            node -e "const fs=require('fs');let r={};try{r=JSON.parse(fs.readFileSync('/tmp/cf-probe.json'))}catch{}console.log(process.argv[1], 'HTTP',process.argv[2], 'success',r.success,'errors',JSON.stringify((r.errors||[]).map(e=>({code:e.code,message:e.message}))))" "$path" "$status"
          done
      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          wranglerVersion: '4.140.0'
          command: deploy --config wrangler.sandbox.jsonc
      - name: Verify sandbox endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 --silent --show-error \
            https://vermillion-checkout-sandbox.timothyjosephmurphy.workers.dev/checkout/health \
            | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const h=JSON.parse(s);if(h.mode!=='sandbox'||h.enabled!==true)process.exit(1);console.log('Sandbox endpoint enabled')})"
