name: Deploy isolated checkout sandbox
on:
  push:
    branches: [main, shared-paypal-checkout, prodigi-print-ordering]
    paths:
      - 'cloudflare/**'
      - 'payments/verify-sandbox.mjs'
      - 'payments/verify-print-sandbox.mjs'
      - 'payments/finerworks-report-public.pem'
      - 'payments/prepare-sandbox-sales-archive.mjs'
      - 'catalog/**'
      - 'payments/check-production-config.mjs'
      - 'payments/configure-finerworks-billing.mjs'
      - '.github/workflows/deploy-checkout-sandbox.yml'
  workflow_dispatch:
    inputs:
      replay_webhook:
        description: Request a fresh PayPal webhook replay
        type: boolean
        default: false
      test_print_orders:
        description: Submit unbilled FinerWorks sandbox test orders
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private sandbox accounting storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
        run: node payments/prepare-sandbox-sales-archive.mjs
      - name: Verify checkout and catalog
        run: |
          npm ci
          npm run build
          npm test
          node --test tests/print*.test.mjs cloudflare/finerworks-*.test.mjs
          npm --prefix cloudflare/test ci
          npm run test:worker
          node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs cloudflare/checkout-recovery.test.mjs cloudflare/checkout-readiness.test.mjs
          node payments/build-checkout-catalog.mjs
          git diff --exit-code -- cloudflare/checkout-catalog.mjs cloudflare/print-catalog.mjs
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.sandbox.jsonc'));if(c.name!=='vermillion-checkout-sandbox'||c.vars.PAYPAL_MODE!=='sandbox'||c.vars.PAYPAL_CHECKOUT_ENABLED!=='true'||c.vars.PRINT_PROVIDER!=='finerworks'||c.vars.PRINT_CHECKOUT_ENABLED!=='true'||c.vars.FINERWORKS_ORDER_ENABLED!=='true'||c.main!=='checkout-sandbox.mjs')process.exit(1)"
      - name: Build production Worker without deploying
        run: |
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc'));if(c.name!=='vermillion-commissions'||c.vars.PAYPAL_MODE!=='live'||c.vars.PRODIGI_ENV!=='live'||c.vars.PRINT_CHECKOUT_ENABLED!=='false'||!['false','true'].includes(c.vars.PAYPAL_CHECKOUT_ENABLED))process.exit(1)"
          npx --yes wrangler@4.143.0 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/production-worker
      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Configure saved FinerWorks billing token when explicitly requested
        if: contains(github.event.head_commit.message, '[configure-finerworks-billing]')
        env:
          CLOUDFLARE_SANDBOX_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node payments/configure-finerworks-billing.mjs
      - name: Verify FinerWorks prices shipping and validation-only preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        # Ordinary updates only quote and validate. The marker requests an explicit unbilled pilot run.
        run: node payments/verify-print-sandbox.mjs ${{ (inputs.test_print_orders || contains(github.event.head_commit.message, '[print-pilot-test]')) && '--test-orders --pilot-checkout' || '' }}
      - name: Preserve encrypted FinerWorks audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finerworks-audit-${{ github.sha }}
          path: /tmp/finerworks-audit.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Confirm recorded sandbox payment, webhook receipt, and tax record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
        run: node payments/verify-sandbox.mjs ${{ inputs.replay_webhook && '--replay' || '' }}
  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/check-production-config.mjs
