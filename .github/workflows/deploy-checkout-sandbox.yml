name: Deploy isolated checkout sandbox
run-name: Diagnose sandbox shipping and tax quote

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-checkout-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-paypal-checkout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sandbox isolation and checkout tests
        run: |
          node --test cloudflare/paypal-inventory.test.mjs cloudflare/paypal-orders.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.sandbox.jsonc')); if(c.name!=='vermillion-checkout-sandbox'||c.vars.PAYPAL_MODE!=='sandbox'||c.vars.PAYPAL_CHECKOUT_ENABLED!=='true'||c.main!=='checkout-sandbox.mjs') process.exit(1)"
      - name: Check Cloudflare metadata permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          base=https://api.cloudflare.com/client/v4/accounts/3c1fddf0f4f4fc9c84594757d2e1bda0
          for path in \
            'workers/services/vermillion-checkout-sandbox/environments/production/routes?show_zonename=true' \
            'workers/domains/records?page=0&per_page=5&service=vermillion-checkout-sandbox&environment=production'
          do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$path")
            if [ "$status" != 200 ]; then
              echo "Cloudflare metadata read failed (HTTP $status) for $path" >&2
              echo 'The token needs Workers product Metadata Read-Only in addition to sandbox Worker Editor.' >&2
              exit 1
            fi
          done
      - name: Deploy sandbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc
      - name: Verify sandbox endpoint
        run: |
          curl --retry 5 --retry-delay 2 --silent --show-error \
            --output /tmp/sandbox-health.txt --write-out 'Sandbox health HTTP %{http_code}\\n' \
            https://vermillion-checkout-sandbox.timothyjosephmurphy.workers.dev/checkout/health
          cat /tmp/sandbox-health.txt
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/sandbox-health.txt'));if(h.mode!=='sandbox'||h.enabled!==true)process.exit(1);console.log('Sandbox endpoint enabled')"
      - name: Verify configured checkout and quote
        run: |
          base=https://vermillion-checkout-sandbox.timothyjosephmurphy.workers.dev
          curl --silent --show-error --output /tmp/checkout-status.json --write-out 'Checkout status HTTP %{http_code}\n' \
            "$base/checkout/status?slug=honeybadger-and-cub-with-genesis-block"
          cat /tmp/checkout-status.json
          node -e "const s=JSON.parse(require('fs').readFileSync('/tmp/checkout-status.json'));if(s.status!=='available')process.exit(1)"
          curl --silent --show-error --output /tmp/checkout-quote.json --write-out 'Checkout quote HTTP %{http_code}\n' \
            --header 'Content-Type: application/json' --data '{"slug":"honeybadger-and-cub-with-genesis-block","address":{"name":"Test Buyer","street1":"1600 Amphitheatre Pkwy","city":"Mountain View","state":"CA","zip":"94043"}}' \
            "$base/checkout/quote"
          cat /tmp/checkout-quote.json
          node -e "const q=JSON.parse(require('fs').readFileSync('/tmp/checkout-quote.json'));if(!q.total||!q.shipping||!q.tax)process.exit(1)"
