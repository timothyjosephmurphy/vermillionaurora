name: Prepare Goat Lake print quotes
# Side branch only (never merged): read-only FinerWorks quotes for archived-painting-308's new capped
# editions through the isolated sandbox. No orders, no payments. Results come back as artifacts.
on:
  push:
    branches: [goat-lake-quotes]
permissions:
  contents: read
jobs:
  quote-prints:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: checkout-sandbox
      cancel-in-progress: false
    env:
      TJ_PRINT_IDS: archived-painting-308
      PRINT_RECIPE_SET: archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-size files and build the quote-only catalog
        run: |
          npm ci
          node scripts/build-pilot-print-assets.mjs
          node scripts/build-edition-print-assets.mjs
          node payments/build-print-catalog.mjs
          node payments/build-checkout-catalog.mjs
      - name: Deploy quote-only catalog to sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Quote bordered and padded editions (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node payments/quote-tj-prints.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: goat-lake-padded-quotes
          path: tj-print-quotes.json
          retention-days: 7
      - name: Framing quotes (read-only, diagnostic)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node payments/quote-tj-prints.mjs --frames
          node payments/apply-tj-frame-quotes.mjs tj-frame-quotes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goat-lake-frame-quotes
          path: |
            tj-frame-quotes.json
            catalog/prints.json
          retention-days: 7
