name: Set catalog admin password on the website Worker
# Copies the repo secret CATALOG_ADMIN_PASSWORD into the vermillionaurora Worker secret of the same name
# (used by /catalog-admin/). Run after changing the repo secret:
#   gh workflow run set-catalog-admin-secret.yml
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Put the Worker secret (value never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c1fddf0f4f4fc9c84594757d2e1bda0
          CATALOG_ADMIN_PASSWORD: ${{ secrets.CATALOG_ADMIN_PASSWORD }}
        run: |
          test -n "$CATALOG_ADMIN_PASSWORD"
          printf '%s' "$CATALOG_ADMIN_PASSWORD" | npx -y wrangler@4 secret put CATALOG_ADMIN_PASSWORD --name vermillionaurora
      - name: Check the admin is configured
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://tjm.art' -H 'Content-Type: application/json' -d '{"password":"-"}' https://tjm.art/catalog-admin/api/login)
          echo "login with a wrong password: HTTP $code (403 = configured, 503 = missing)"; test "$code" = 403
