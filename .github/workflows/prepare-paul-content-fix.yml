name: Prepare Paul Murphy content corrections
on:
  push:
    branches: [fix/paul-book-link-arizona-20261001]
    paths: [.github/workflows/prepare-paul-content-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paul-book-link-arizona-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only the requested content corrections
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const catalogPath='catalog/products.json';
          const original=readFileSync(catalogPath,'utf8');
          const products=JSON.parse(original);
          const target=products.find(p=>p.id==='paul-murphy-painting-8');
          assert.equal(target?.artist,'Paul Murphy');
          assert.equal(Number(target.gallerySequence),9);
          assert.equal(target.title,'Arixona Slot Cave');
          assert.equal(original.split('Arixona Slot Cave').length-1,4);
          const revised=original.replaceAll('Arixona Slot Cave','Arizona Slot Cave');
          const updated=JSON.parse(revised);
          assert.deepEqual(products.filter(p=>p.id!==target.id),updated.filter(p=>p.id!==target.id));
          const expected=structuredClone(target);
          expected.title='Arizona Slot Cave';
          expected.description=expected.description.replace('Arixona Slot Cave','Arizona Slot Cave');
          expected.image.alt=expected.image.alt.replace('Arixona Slot Cave','Arizona Slot Cave');
          expected.image.caption=expected.image.caption.replace('Arixona Slot Cave','Arizona Slot Cave');
          assert.deepEqual(updated.find(p=>p.id===target.id),expected);
          const book=products.find(p=>p.id==='reflections-on-time');
          assert.equal(book?.type,'book');
          assert.equal(book.slug,'reflections-on-time');
          assert.ok(book.book.pdfUrl.startsWith('https://'));
          writeFileSync(catalogPath,revised);
          const pagePath='src/pages/exhibitions/paul-murphy/index.astro';
          const page=readFileSync(pagePath,'utf8');
          const before='You can also <a href="/products/reflections-on-time/">explore Reflections on Time here</a>.';
          const after='<a href="/products/reflections-on-time/">You can also explore <em>Reflections on Time</em> here.</a>';
          assert.equal(page.split(before).length-1,1);
          const rule='.paul-introduction p{margin:0 0 14px}';
          assert.equal(page.split(rule).length-1,1);
          writeFileSync(pagePath,page.replace(before,after).replace(rule,rule+'.paul-introduction a{text-decoration:underline;text-underline-offset:.18em}'));
          console.log('Corrected sequence 9 (stable ID paul-murphy-painting-8), title metadata and full-sentence book link.');
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify generated gallery, product, PDF page and checkout catalog
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {load} from 'cheerio';
          import checkout from './cloudflare/checkout-catalog.mjs';
          const gallery=load(readFileSync('dist/exhibitions/paul-murphy/index.html','utf8'));
          const bookLink=gallery('.paul-introduction a[href="/products/reflections-on-time/"]');
          assert.equal(bookLink.length,1);
          assert.equal(bookLink.text(),'You can also explore Reflections on Time here.');
          assert.match(gallery('style').text(),/\.paul-introduction a\{[^}]*text-decoration:underline/);
          const paintingLink=gallery('.paul-gallery a[href="/products/paul-murphy-painting-8/"]');
          assert.ok(paintingLink.length>0);
          assert.match(paintingLink.text(),/Arizona Slot Cave/);
          assert.ok(!gallery.html().includes('Arixona'));
          const painting=load(readFileSync('dist/products/paul-murphy-painting-8/index.html','utf8'));
          assert.equal(painting('h1').text(),'Arizona Slot Cave');
          assert.match(painting('meta[name="description"]').attr('content'),/Arizona Slot Cave/);
          assert.equal(checkout['paul-murphy-painting-8'].title,'Arizona Slot Cave');
          const book=load(readFileSync('dist/products/reflections-on-time/index.html','utf8'));
          assert.equal(book('#read-book iframe').length,1);
          assert.ok(book('#read-book iframe').attr('src').startsWith('https://'));
          assert.ok(book('#read-book a').attr('href').startsWith('https://'));
          console.log('PASS: full-sentence underlined book link, PDF viewer, gallery title, product title/metadata and checkout title.');
          NODE
      - name: Commit only source corrections and generated checkout catalog
        run: |
          git diff --check
          git add catalog/products.json src/pages/exhibitions/paul-murphy/index.astro cloudflare/checkout-catalog.mjs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Paul Murphy book link and Arizona Slot Cave spelling'
          git push origin HEAD:fix/paul-book-link-arizona-20261001
