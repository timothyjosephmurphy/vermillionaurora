name: Inspect live print configuration
on:
  push:
    branches: [finerworks-print-ordering]
    paths: ['payments/check-print-readiness.mjs', '.github/workflows/check-print-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production mode and credential presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/check-print-readiness.mjs
