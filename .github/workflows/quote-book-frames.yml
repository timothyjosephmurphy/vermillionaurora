name: Quote frames for book print editions
on:
  push:
    branches: [codex/book-print-framing-fix-20261002]
    paths:
      - '.github/workflows/quote-book-frames.yml'
      - 'payments/quote-book-frames.mjs'
      - 'payments/apply-book-frame-quotes.mjs'
permissions:
  contents: write
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve FinerWorks frame prices without submitting orders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
        run: node payments/quote-book-frames.mjs
      - name: Apply exact quotes and validate book frame choices
        run: |
          node payments/apply-book-frame-quotes.mjs book-frame-quotes.json
          node payments/build-print-catalog.mjs
          node --test tests/book-print-framing.test.mjs
      - name: Commit current quotes to the isolated feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/book-prints.json cloudflare/print-catalog.mjs
          git commit -m 'Add supplier-verified frames to book print editions'
          git push origin HEAD:codex/book-print-framing-fix-20261002
