# Temporary (removed before merge): supplier quotes for a replaced print master. Read-only, no orders.
name: Quote replaced print master
on:
  push:
    branches: [codex/rainier-trim-master]
    paths: ['.github/workflows/quote-replaced-prints.yml']
permissions:
  contents: read
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TJ_PRINT_IDS: painting-portrait-with-hat
      DEPLOYED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && npm run build && node payments/build-print-catalog.mjs && node payments/build-etsy-print-source.mjs && node payments/build-checkout-catalog.mjs
      - name: Deploy sandbox with replaced master
        run: cd cloudflare && npx --yes wrangler@4.143.0 deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
        env: {CLOUDFLARE_ACCOUNT_ID: 3c1fddf0f4f4fc9c84594757d2e1bda0}
      - run: node payments/quote-tj-prints.mjs && node payments/apply-tj-print-quotes.mjs
      - run: node payments/build-print-catalog.mjs && node payments/build-etsy-print-source.mjs && node payments/build-checkout-catalog.mjs
      - name: Redeploy sandbox with print prices
        run: cd cloudflare && npx --yes wrangler@4.143.0 deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
        env: {CLOUDFLARE_ACCOUNT_ID: 3c1fddf0f4f4fc9c84594757d2e1bda0}
      - run: node payments/quote-tj-prints.mjs --frames && node payments/apply-tj-frame-quotes.mjs tj-frame-quotes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: quotes, path: "catalog/prints.json\ntj-print-quotes.json\ntj-frame-quotes.json", retention-days: 1}
