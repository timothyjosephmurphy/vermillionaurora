name: Publish reviewed Paul Murphy price batch
on:
  push:
    branches: [ops/publish-paul-price-batch]
    paths: ['.github/workflows/publish-paul-price-batch.yml']
permissions:
  contents: read
concurrency:
  group: website-production-retry
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22a5d0b3525052ad8695401b54c9e5d293000b60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm reviewed release
        run: |
          test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Publish approved website release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          command: deploy --config wrangler.jsonc
      - name: Verify live Paul Murphy gallery prices
        run: |
          node --input-type=module <<'NODE'
          import {load} from 'cheerio';
          const expected=[{"id":"paul-murphy-painting-2","amount":"150.00"},{"id":"paul-murphy-painting-23","amount":"150.00"},{"id":"paul-murphy-painting-24","amount":"150.00"},{"id":"paul-murphy-painting-25","amount":"150.00"},{"id":"paul-murphy-painting-27","amount":"150.00"},{"id":"paul-murphy-painting-28","amount":"150.00"},{"id":"paul-murphy-painting-34","amount":"150.00"},{"id":"paul-murphy-painting-35","amount":"150.00"},{"id":"paul-murphy-painting-38","amount":"150.00"},{"id":"paul-murphy-painting-39","amount":"150.00"},{"id":"paul-murphy-painting-40","amount":"150.00"},{"id":"paul-murphy-painting-41","amount":"150.00"},{"id":"paul-murphy-painting-43","amount":"150.00"},{"id":"paul-murphy-painting-44","amount":"150.00"},{"id":"paul-murphy-painting-45","amount":"150.00"},{"id":"paul-murphy-painting-51","amount":"150.00"},{"id":"paul-murphy-painting-7","amount":"150.00"},{"id":"paul-murphy-painting-72","amount":"150.00"},{"id":"paul-murphy-painting-74","amount":"150.00"},{"id":"paul-murphy-painting-82","amount":"150.00"},{"id":"paul-murphy-painting-83","amount":"150.00"},{"id":"paul-murphy-painting-84","amount":"150.00"},{"id":"paul-murphy-painting-85","amount":"150.00"},{"id":"paul-murphy-painting-11","amount":"250.00"},{"id":"paul-murphy-painting-14","amount":"300.00"},{"id":"paul-murphy-painting-15","amount":"300.00"},{"id":"paul-murphy-painting-3","amount":"250.00"},{"id":"paul-murphy-painting-6","amount":"250.00"},{"id":"paul-murphy-painting-73","amount":"250.00"},{"id":"paul-murphy-painting-55","amount":"300.00"},{"id":"paul-murphy-painting-8","amount":"300.00"}];
          let ready=false;
          for(let attempt=0;attempt<18;attempt++){
            try{
              const response=await fetch('https://vermillionaurora.com/exhibitions/paul-murphy/?price-release=22a5d0b3525052ad8695401b54c9e5d293000b60-'+attempt,{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(!response.ok)throw Error('Gallery response '+response.status);
              const $=load(await response.text());
              if($('meta[name="catalog-version"]').attr('content')!=='a3c1524eaa7157f40baf')throw Error('Old gallery catalog');
              for(const item of expected){
                const card=$('[data-product-id="'+item.id+'"]');
                const price='$'+Number(item.amount)+' USD';
                if(card.find('[data-card-price]').text().trim()!==price&&!card.attr('data-caption')?.endsWith(price))throw Error('Incorrect gallery price '+item.id);
              }
              ready=true;console.log('Verified all '+expected.length+' Paul Murphy gallery prices at catalog a3c1524eaa7157f40baf.');break;
            }catch(error){console.log(error.message);}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('Approved gallery prices are not live');
          NODE
