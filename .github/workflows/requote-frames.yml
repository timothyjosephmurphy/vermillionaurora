# Temporary (removed before merge): re-quote every framed print at current FinerWorks costs. Read-only sandbox, no orders.
name: Re-quote framed prints
on:
  push:
    branches: [codex/requote-frames]
    paths: ['.github/workflows/requote-frames.yml']
permissions:
  contents: read
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOYED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && node scripts/build-pilot-print-assets.mjs && node payments/build-print-catalog.mjs && node payments/build-etsy-print-source.mjs && node payments/build-checkout-catalog.mjs
      - name: Deploy sandbox
        run: cd cloudflare && npx --yes wrangler@4.143.0 deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
        env: {CLOUDFLARE_ACCOUNT_ID: 3c1fddf0f4f4fc9c84594757d2e1bda0}
      - run: node payments/refresh-print-frame-quotes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frames, path: "catalog/prints.json\ncatalog/book-prints.json\nprint-frame-quotes.json", retention-days: 2}
