name: Verify FinerWorks pilot checkout
on:
  push:
    branches: [print-order-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/print*.test.mjs cloudflare/finerworks-*.test.mjs
      - run: npm --prefix cloudflare/test ci
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: node tests/print-checkout.browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-checkout-previews
          path: /tmp/print-checkout-*.png
