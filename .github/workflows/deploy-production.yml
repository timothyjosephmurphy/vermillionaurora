name: Deploy production from main
# Merging to main deploys production directly. This workflow publishes the checkout Worker
# (vermillion-commissions) as soon as the run starts, in parallel with Cloudflare Workers Builds,
# which deploys the website Worker (vermillionaurora) from main. Verification starts only after
# checkout /checkout/health reports this commit, then waits for Workers Builds and checks both.
# Neural Dance is served by vermillion-neural-dance, not by this workflow.
# Pull request preview URLs stay on Workers Builds: this workflow does not deploy vermillionaurora
# and does not run on pull_request.
# The release branch is a frozen backup and no longer deploys anything from this workflow.
# Roll back with: gh workflow run rollback.yml -f target=checkout
# Token: CLOUDFLARE_PROD_API_TOKEN, falling back to CLOUDFLARE_SANDBOX_API_TOKEN while that
# secret is empty. Permissions are listed in docs/cloudflare-prod-api-token.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Check every product page, original and print file (slow)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
env:
  FULL_CHECKS: ${{ inputs.full_checks && '1' || '0' }}
  PRINT_ASSET_SAMPLE: ${{ inputs.full_checks && 'all' || 'sample' }}
jobs:
  changes:
    name: Classify this push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.changes.outputs.tier }}
      deploy_checkout: ${{ steps.changes.outputs.deploy_checkout }}
      deploy_site: ${{ steps.changes.outputs.deploy_site }}
      files: ${{ steps.changes.outputs.files }}
      before: ${{ steps.changes.outputs.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ github.event_name != 'push' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            gh api "repos/${{ github.repository }}/compare/${before}...${{ github.sha }}" --jq '.files[]?.filename' > /tmp/changed.txt || : > /tmp/changed.txt
          else
            : > /tmp/changed.txt
          fi
          # The compare API lists at most 300 files. Treat a capped list as unknown and run the full path.
          if [ "$(wc -l < /tmp/changed.txt | tr -d ' ')" -ge 300 ]; then
            echo "Compare returned 300 files; running the full production path."
            FORCE_FULL=true
          fi
          FORCE_FULL="$FORCE_FULL" node scripts/ci/classify-changes.mjs < /tmp/changed.txt
          {
            echo "files<<EOF"
            head -500 /tmp/changed.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  deploy-checkout:
    name: Deploy checkout Worker
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_checkout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show which Cloudflare API token is in use
        env:
          PROD_TOKEN_SET: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN != '' }}
        run: |
          if [ "$PROD_TOKEN_SET" = "true" ]; then
            echo "Cloudflare API token source: CLOUDFLARE_PROD_API_TOKEN"
          else
            echo "Cloudflare API token source: fallback CLOUDFLARE_SANDBOX_API_TOKEN (CLOUDFLARE_PROD_API_TOKEN is empty). Create it with the permissions in docs/cloudflare-prod-api-token.md."
          fi
      - name: Verify production checkout config
        run: node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc'));if(c.name!=='vermillion-commissions'||c.vars.CHECKOUT_MODE!=='live')process.exit(1)"
      - name: Prepare and verify private accounting storage
        run: node payments/prepare-sales-archive.mjs
      - name: Verify commission reference and accounting storage are private
        run: node payments/verify-commission-privacy.mjs
      - name: Deploy the checkout Worker with the checked-in checkout settings
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          command: deploy --config wrangler.jsonc --var CHECKOUT_RELEASE:${{ github.sha }} --message "main ${{ github.sha }}"
          # QuickBooks Online app credentials (repository secrets), uploaded as Worker secrets.
          secrets: |
            QBO_CLIENT_ID
            QBO_CLIENT_SECRET
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
      - name: Verify the deployed production revision
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8')).vars;
          const url='https://vermillion-commissions.timothyjosephmurphy.workers.dev/checkout/health';
          let ready=false;
          for(let i=0;i<30;i++){
            const r=await fetch(url);const h=await r.json().catch(()=>({}));
            if(r.ok&&h.mode==='live'&&h.release===process.env.DEPLOYED_SHA){ready=true;console.log('Production checkout health:',JSON.stringify(h));break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('The expected production revision did not become ready');
          NODE
  verify-site:
    name: Verify website release
    needs: [changes, deploy-checkout]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN || secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/test/package-lock.json
      - name: Install dependencies
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - run: npm run build
      - name: Verify generated catalogs and production checkout config
        run: |
          git diff --exit-code -- cloudflare/checkout-catalog.mjs cloudflare/print-catalog.mjs cloudflare/print-catalog-version.mjs cloudflare/print-assets/print-catalog.json
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc'));if(c.name!=='vermillion-commissions'||c.vars.CHECKOUT_MODE!=='live')process.exit(1)"
      - name: Show which Cloudflare API token is in use
        env:
          PROD_TOKEN_SET: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN != '' }}
        run: |
          if [ "$PROD_TOKEN_SET" = "true" ]; then
            echo "Cloudflare API token source: CLOUDFLARE_PROD_API_TOKEN"
          else
            echo "Cloudflare API token source: fallback CLOUDFLARE_SANDBOX_API_TOKEN (CLOUDFLARE_PROD_API_TOKEN is empty). Create it with the permissions in docs/cloudflare-prod-api-token.md."
          fi
      - name: Work out what changed in this push
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            gh api "repos/${{ github.repository }}/compare/$before...${{ github.sha }}" --jq '.files[].filename' > /tmp/changed.txt || : > /tmp/changed.txt
          else
            : > /tmp/changed.txt
          fi
          node scripts/ci/changed-products.mjs < /tmp/changed.txt
      - name: Wait for Workers Builds to publish this website version, then check sampled print files
        env:
          CHANGED_PRINT_PRODUCTS: ${{ steps.changes.outputs.print_products }}
        run: node payments/verify-live-print-assets.mjs
      - name: Verify published blog cards, articles, and photos
        if: steps.changes.outputs.blog == 'true' || steps.changes.outputs.unknown == 'true'
        run: node scripts/verify-blog-pages.mjs --live
      - name: Verify live providers without taking payment
        run: node payments/verify-production.mjs
      - name: Verify website and API catalog versions agree
        env:
          CHANGED_PRODUCT_SLUGS: ${{ steps.changes.outputs.product_slugs }}
        run: node scripts/verify-release.mjs
      - name: Quote one print and one framed print (no payment, no order)
        run: node payments/verify-sampled-quote.mjs
