name: Run reviewed Buffer operation
on:
  push:
    branches: ['ops/buffer-*']
    paths: ['social/buffer-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-production-release
  cancel-in-progress: false
jobs:
  buffer:
    if: startsWith(github.ref, 'refs/heads/ops/buffer-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute the reviewed request through the private Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          operation="$(node -e "console.log(JSON.parse(require('fs').readFileSync('social/buffer-request.json','utf8')).operation)")"
          if [ "$operation" = "nostr-status" ]; then
            curl --fail --silent --show-error https://vermillion-nostr-publisher.timothyjosephmurphy.workers.dev/status
          else
            node payments/buffer-operation.mjs social/buffer-request.json
          fi
