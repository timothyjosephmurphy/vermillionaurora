name: Release gate

# Tiered PR gate. The required status check is the final job named "gate".
#   blog     story HTML and that post's display/social files: build + article check. No Playwright.
#   content  catalog data, images, other static, docs: build + changed pages load.
#   code     site code: build + unit tests + browser tests for touched areas + smoke.
#   print-master only prints.json/master files for existing paintings: content + 3 sampled sandbox quotes.
#   full     checkout, payments, workers, CI, dependencies, or manual runs: the full suite.
# prepare builds once and uploads dist/. Browser jobs use the Playwright image that matches
# package-lock.json (browsers and OS libraries are already installed). Checkout is shallow.
# Testing never takes payment, submits FinerWorks orders, or holds originals.
on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

# The Playwright image does not default to bash. `sh` rejects `pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tier: ${{ steps.changes.outputs.tier }}
      browser_tests: ${{ steps.changes.outputs.browser_tests }}
      print_quotes: ${{ steps.changes.outputs.print_quotes }}
      files: ${{ steps.changes.outputs.files }}
      room: ${{ steps.changes.outputs.room }}
      chromium_shards: ${{ steps.changes.outputs.chromium_shards }}
      chromium_shard_total: ${{ steps.changes.outputs.chromium_shard_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Classify changed paths
        id: changes
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename' > /tmp/changed.txt || : > /tmp/changed.txt
          else
            : > /tmp/changed.txt
          fi
          classified=$(node scripts/ci/classify-changes.mjs < /tmp/changed.txt)
          printf '%s\n' "$classified"
          tier=$(printf '%s' "$classified" | node --input-type=module -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).tier))")
          if [ "${{ github.base_ref }}" = "release" ]; then
            tier=release
            echo "tier=release" >> "$GITHUB_OUTPUT"
          fi
          if [ "$tier" = "full" ]; then
            echo 'chromium_shards=["1","2"]' >> "$GITHUB_OUTPUT"
            echo 'chromium_shard_total=2' >> "$GITHUB_OUTPUT"
          else
            echo 'chromium_shards=["1"]' >> "$GITHUB_OUTPUT"
            echo 'chromium_shard_total=1' >> "$GITHUB_OUTPUT"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          head -500 /tmp/changed.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/test/package-lock.json
      - name: Install dependencies without browsers
        if: steps.changes.outputs.tier == 'blog'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Install dependencies
        if: steps.changes.outputs.tier != 'blog'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Build the site
        timeout-minutes: 30
        run: npm run build
      - name: Confirm generated catalogs are committed
        timeout-minutes: 2
        run: git diff --exit-code -- cloudflare/checkout-catalog.mjs cloudflare/commission-deposits.mjs cloudflare/print-catalog.mjs cloudflare/etsy-print-source.mjs cloudflare/etsy-sync-source.mjs
      - name: Validate production Worker configuration
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8'));
          if(config.name!=='vermillion-commissions') {
            throw new Error('Unexpected production Worker configuration');
          }
          NODE
      - name: Upload the built site
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  unit-and-print:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.tier == 'blog' || needs.prepare.outputs.tier == 'code' || needs.prepare.outputs.tier == 'full')
    runs-on: ubuntu-latest
    # dist/ is about 5 GB. A stalled download needs a second attempt, so the job
    # is longer than the test steps.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/test/package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Download the built site
        id: dist
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Clear a partial site download
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 2
        run: rm -rf dist
      - name: Download the built site again
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 12
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Confirm changed blog articles are on the index
        if: needs.prepare.outputs.tier == 'blog'
        timeout-minutes: 5
        env:
          CHANGED_FILES: ${{ needs.prepare.outputs.files }}
        run: |
          node scripts/verify-blog-pages.mjs --changed
          node --test tests/blog-card-images.test.mjs
      - name: Run application tests
        if: needs.prepare.outputs.tier == 'code' || needs.prepare.outputs.tier == 'full'
        timeout-minutes: 15
        run: npm test
      - name: Run print unit tests
        if: needs.prepare.outputs.tier == 'code' || needs.prepare.outputs.tier == 'full'
        timeout-minutes: 10
        run: npm run test:print
      - name: Install Cloudflare Worker test dependencies
        if: needs.prepare.outputs.tier == 'full'
        timeout-minutes: 5
        run: |
          n=0
          until npm --prefix cloudflare/test ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Run Cloudflare Worker tests
        if: needs.prepare.outputs.tier == 'full'
        timeout-minutes: 10
        run: npm run test:worker

  browser-chromium:
    needs: prepare
    if: needs.prepare.result == 'success' && (needs.prepare.outputs.tier == 'content' || needs.prepare.outputs.tier == 'code' || needs.prepare.outputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.chromium_shards || '["1"]') }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Download the built site
        id: dist
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Clear a partial site download
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 2
        run: rm -rf dist
      - name: Download the built site again
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 12
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run Chromium browser tests
        timeout-minutes: 25
        env:
          CHANGED_FILES: ${{ needs.prepare.outputs.files }}
          TIER: ${{ needs.prepare.outputs.tier }}
          BROWSER_TESTS: ${{ needs.prepare.outputs.browser_tests }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.prepare.outputs.chromium_shard_total }}
        run: |
          set -euo pipefail
          if [ "$TIER" = "full" ]; then
            node tests/run-browser.mjs --shard="${SHARD}/${SHARD_TOTAL}" --engine=chromium
          else
            node tests/run-browser.mjs -- tests/smoke.browser-test.mjs $BROWSER_TESTS
          fi
      - name: Save browser previews
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews-chromium-${{ matrix.shard }}
          path: |
            /tmp/gallery-wall-*.png
            /tmp/gallery-room-*.png
            /tmp/paintings-wall-*.png
          if-no-files-found: ignore
          retention-days: 1

  browser-webkit:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root --shm-size=1g
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Download the built site
        id: dist
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Clear a partial site download
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 2
        run: rm -rf dist
      - name: Download the built site again
        if: steps.dist.outcome == 'failure'
        timeout-minutes: 12
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run WebKit browser tests
        timeout-minutes: 20
        env:
          CHANGED_FILES: ${{ needs.prepare.outputs.files }}
        run: node tests/run-browser.mjs --engine=webkit
      - name: Save browser previews
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews-webkit
          path: |
            /tmp/gallery-wall-*.png
            /tmp/gallery-room-*.png
            /tmp/paintings-wall-*.png
          if-no-files-found: ignore
          retention-days: 1

  print-quotes:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.print_quotes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch the base commit for catalog comparison
        timeout-minutes: 5
        run: git fetch --depth=1 origin "${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Deploy sandbox with this catalog
        timeout-minutes: 10
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Three sampled supplier quotes of the changed painting
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/ci/sample-print-quotes.mjs

  gate:
    name: gate
    needs: [prepare, unit-and-print, browser-chromium, browser-webkit, print-quotes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless required jobs succeeded or were skipped
        timeout-minutes: 2
        env:
          PREPARE: ${{ needs.prepare.result }}
          UNIT: ${{ needs.unit-and-print.result }}
          CHROMIUM: ${{ needs.browser-chromium.result }}
          WEBKIT: ${{ needs.browser-webkit.result }}
          QUOTES: ${{ needs.print-quotes.result }}
        run: |
          node --input-type=module <<'NODE'
          const results = {
            prepare: process.env.PREPARE,
            'unit-and-print': process.env.UNIT,
            'browser-chromium': process.env.CHROMIUM,
            'browser-webkit': process.env.WEBKIT,
            'print-quotes': process.env.QUOTES,
          };
          console.log(results);
          if (results.prepare !== 'success') {
            console.error('prepare must succeed');
            process.exit(1);
          }
          const bad = Object.entries(results).filter(([, result]) => result !== 'success' && result !== 'skipped');
          if (bad.length) {
            console.error('Required jobs did not succeed:', bad);
            process.exit(1);
          }
          NODE
