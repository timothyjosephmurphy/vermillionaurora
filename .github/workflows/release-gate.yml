name: Release gate

# Tiered PR gate (required check: "gate").
#   blog     (story HTML, blog index, that post's display/social files, blog upload assets): build + article check. No Playwright.
#   content  (catalog data, images, other static, docs): build + changed pages load.
#   code     (site code): build + unit tests + browser tests for touched areas + smoke.
#   print-master (only prints.json/master files for existing paintings): content + 3 sampled sandbox quotes.
#   full     (checkout, payments, workers, CI, dependencies, or manual runs): the full suite.
# Testing never takes payment, submits FinerWorks orders, or holds originals.
on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Backstop if a cold install is slow. Cached browsers should make later runs short.
    # A cold Ubuntu 26 WebKit apt install has taken about 50 minutes and then cancelled
    # the full suite at 60, while the browser tests that had started were still passing.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename' > /tmp/changed.txt || : > /tmp/changed.txt
          else
            : > /tmp/changed.txt
          fi
          node scripts/ci/classify-changes.mjs < /tmp/changed.txt
          # The frozen release branch only needs build and config checks.
          if [ "${{ github.base_ref }}" = "release" ]; then echo "tier=release" >> "$GITHUB_OUTPUT"; fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; head -500 /tmp/changed.txt >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/test/package-lock.json
      # Blog publishes skip the Playwright browser download inside npm ci. Other tiers keep
      # the normal install; their later steps still install the browsers they run.
      - name: Install dependencies without browsers
        if: steps.changes.outputs.tier == 'blog'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - name: Install dependencies
        if: steps.changes.outputs.tier != 'blog'
        run: |
          n=0
          until npm ci; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "npm ci failed; retrying once"
            sleep 8
          done
      - run: npm run build
      - name: Confirm generated catalogs are committed
        run: git diff --exit-code -- cloudflare/checkout-catalog.mjs cloudflare/commission-deposits.mjs cloudflare/print-catalog.mjs cloudflare/etsy-print-source.mjs cloudflare/etsy-sync-source.mjs
      - name: Validate production Worker configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8'));
          if(config.name!=='vermillion-commissions') {
            throw new Error('Unexpected production Worker configuration');
          }
          NODE
      - name: Confirm changed blog articles are on the index
        if: steps.changes.outputs.tier == 'blog'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          node scripts/verify-blog-pages.mjs --changed
          node --test tests/blog-card-images.test.mjs
      - name: Resolve Playwright version
        id: playwright-version
        if: steps.changes.outputs.tier == 'content' || steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full'
        # Browsers live in ~/.cache/ms-playwright. Key on the version
        # `npx playwright --version` reports (the copy npm ci installed) plus the
        # browser set, so a Chromium-only run cannot pin a cache that is missing WebKit.
        # Install once here, before any suite that launches a browser. Always run
        # install, including on a cache hit: WebKit on ubuntu-latest needs
        # `install --with-deps` for system packages, which are not part of this cache.
        # The blog tier never reaches these steps.
        env:
          TIER: ${{ steps.changes.outputs.tier }}
          BROWSER_TESTS: ${{ steps.changes.outputs.browser_tests }}
        run: |
          version="$(npx playwright --version | tr -d '\r' | awk '{print $NF}')"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected Playwright version: $version" >&2; exit 1 ;;
          esac
          if [ "$TIER" = "full" ] || { [ "$TIER" = "code" ] && [ -n "$BROWSER_TESTS" ]; }; then
            browsers=chromium-webkit
          else
            browsers=chromium
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
          echo "cache_key=${RUNNER_OS}-playwright-${version}-${browsers}" >> "$GITHUB_OUTPUT"
          echo "Playwright $version ($browsers)"
      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.changes.outputs.tier == 'content' || steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
      - name: Install Chromium
        if: steps.changes.outputs.tier == 'content' || steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full'
        run: |
          n=0
          until npx playwright install --only-shell chromium; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "Chromium install failed; retrying once"
            sleep 8
          done
      - name: Install WebKit
        if: steps.changes.outputs.tier == 'full' || (steps.changes.outputs.tier == 'code' && steps.changes.outputs.browser_tests != '')
        run: |
          n=0
          until npx playwright install --with-deps webkit; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then exit 1; fi
            echo "WebKit install failed; retrying once"
            sleep 8
          done
      - name: Save Playwright browsers
        if: (steps.changes.outputs.tier == 'content' || steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full') && steps.playwright-version.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.cache_key }}
      - name: Smoke test home, gallery, product, cart and changed pages
        if: steps.changes.outputs.tier == 'content' || steps.changes.outputs.tier == 'code'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: node tests/smoke.browser-test.mjs
      - name: Run application tests
        if: steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full'
        run: npm test
      - name: Run print unit tests
        if: steps.changes.outputs.tier == 'code' || steps.changes.outputs.tier == 'full'
        run: node --test tests/print*.test.mjs cloudflare/finerworks-*.test.mjs
      - name: Browser tests for touched areas
        if: steps.changes.outputs.tier == 'code' && steps.changes.outputs.browser_tests != ''
        run: for t in ${{ steps.changes.outputs.browser_tests }}; do echo "::group::$t"; node "$t"; echo "::endgroup::"; done
      - name: Deploy sandbox with this catalog (print-master tier)
        if: steps.changes.outputs.print_quotes == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Three sampled supplier quotes of the changed painting (read-only)
        if: steps.changes.outputs.print_quotes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/ci/sample-print-quotes.mjs
      # ---- Full suite (checkout/payments/worker/CI changes and manual runs) ----
      # Chromium and WebKit were installed once above when tier == full.
      - name: Run browser tests
        if: steps.changes.outputs.tier == 'full'
        run: npm run test:browser && node tests/smoke.browser-test.mjs
      - name: Install Cloudflare Worker test dependencies
        if: steps.changes.outputs.tier == 'full'
        run: npm --prefix cloudflare/test ci
      - name: Run Cloudflare Worker tests
        if: steps.changes.outputs.tier == 'full'
        run: npm run test:worker
      - name: Check print framing and print samples
        if: steps.changes.outputs.tier == 'full'
        run: |
          node tests/print-framing.browser-test.mjs
          node tests/live-print-samples.browser-test.mjs
      - name: Save browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews
          path: |
            /tmp/gallery-wall-*.png
            /tmp/gallery-room-*.png
          if-no-files-found: ignore
