name: Release gate

on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/test/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Confirm generated catalogs are committed
        run: git diff --exit-code -- cloudflare/checkout-catalog.mjs cloudflare/commission-deposits.mjs cloudflare/print-catalog.mjs cloudflare/etsy-print-source.mjs cloudflare/etsy-sync-source.mjs
      - name: Validate production Worker configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8'));
          if(config.name!=='vermillion-commissions'||config.vars.PAYPAL_MODE!=='live') {
            throw new Error('Unexpected production Worker configuration');
          }
          NODE
      # Main PRs and manual runs execute the full suite. A main-to-release
      # promotion reruns the build and production-config checks above against
      # the exact release PR commit, without repeating the full suite.
      - name: Install Chromium and WebKit for browser checks
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          npx playwright install --only-shell chromium
          npx playwright install --with-deps webkit
      - name: Check the Babylon gallery room
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: npm run test:room
      - name: Save gallery room browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-room-browser-previews
          path: /tmp/gallery-room-*.png
          if-no-files-found: ignore
      - name: Run application tests
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: npm test
      - name: Run print unit tests
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: node --test tests/print*.test.mjs cloudflare/finerworks-*.test.mjs
      - name: Install Cloudflare Worker test dependencies
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: npm --prefix cloudflare/test ci
      - name: Run Cloudflare Worker tests
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: npm run test:worker
      - name: Run browser tests
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: npm run test:browser
      - name: Save print wall browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-wall-browser-previews
          path: /tmp/gallery-wall-*.png
          if-no-files-found: ignore
      - name: Check print framing and print samples
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          node tests/print-framing.browser-test.mjs
          node tests/live-print-samples.browser-test.mjs
