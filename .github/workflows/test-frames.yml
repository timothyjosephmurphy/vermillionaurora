name: Verify frame recommendations
on:
  push:
    branches: [main, amazon-frame-recommendations, finerworks-print-ordering]
    paths:
      - 'catalog/frames.json'
      - 'catalog/frame-matching.mjs'
      - 'catalog/*mat*.mjs'
      - 'catalog/finerworks-mats.json'
      - 'payments/prints.*'
      - 'src/components/FrameRecommendations.astro'
      - 'src/components/PrintOptions.astro'
      - 'src/scripts/frame-recommendations.js'
      - 'tests/frames*'
      - 'tests/print-matting*'
      - 'tests/print-checkout*'
      - 'cloudflare/print-test-page.mjs'
      - '.github/workflows/test-frames.yml'
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/frames.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/frames.browser-test.mjs
      - run: node --test tests/print-matting.test.mjs
      - run: node tests/print-matting.browser-test.mjs
      - run: node tests/print-checkout.browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-previews
          path: |
            /tmp/frames-*.png
            /tmp/matting-*.png
            /tmp/print-checkout-*.png
