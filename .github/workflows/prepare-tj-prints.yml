name: Prepare TJ print editions
on:
  push:
    branches: [codex/tj-print-editions]
    paths: ['.github/workflows/prepare-tj-prints.yml', 'scripts/prepare-tj-print-masters.py', 'payments/quote-tj-prints.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/tj-print-editions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare reviewed sources and exact-size files
        run: |
          python -m pip install PyMuPDF==1.26.6 Pillow==12.3.0
          npm ci
          python scripts/prepare-tj-print-masters.py
          node scripts/build-edition-print-assets.mjs --prepare-tj
          node scripts/build-pilot-print-assets.mjs
          node payments/build-print-catalog.mjs
          node payments/build-checkout-catalog.mjs
      - name: Deploy quote-only catalog to sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Verify exact unframed prices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node payments/quote-tj-prints.mjs
          node payments/apply-tj-print-quotes.mjs
          node payments/build-print-catalog.mjs
      - name: Deploy priced catalog to sandbox for framing quotes
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Verify all three frame finishes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node payments/quote-tj-prints.mjs --frames
          node payments/apply-tj-frame-quotes.mjs tj-frame-quotes.json
          node payments/build-print-catalog.mjs
          node --test tests/print-tj-editions.test.mjs
      - name: Commit reviewed masters and verified catalog to the preparation branch
        run: |
          git fetch origin codex/tj-print-editions
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/print-masters catalog/prints.json cloudflare/print-catalog.mjs
          git commit -m 'Prepare 18 approved TJ print masters and supplier-verified framing'
          git push origin HEAD:codex/tj-print-editions
      - uses: actions/upload-artifact@v4
        with:
          name: tj-print-quotes
          path: tj-*-quotes.json
          retention-days: 7
