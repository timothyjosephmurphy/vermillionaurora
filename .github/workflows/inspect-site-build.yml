name: Inspect website build
on:
  push:
    branches: [shared-paypal-checkout]
    paths: [.github/workflows/inspect-site-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed preview build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/3c1fddf0f4f4fc9c84594757d2e1bda0';
          for(const path of ['/builds/builds/83536cd7-9c4b-4963-ab46-62a884794cd0','/builds/builds/83536cd7-9c4b-4963-ab46-62a884794cd0/logs']) {
            const r=await fetch(base+path,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
            const d=await r.json();
            console.log(path,'HTTP',r.status);
            if(!r.ok){console.log('Cloudflare error codes:',d.errors?.map(x=>x.code));continue;}
            if(!path.endsWith('/logs')){const b=d.result;console.log(JSON.stringify({status:b.status,build_status:b.build_status,build_outcome:b.build_outcome,branch:b.branch,build_trigger_metadata:b.build_trigger_metadata}));}
            else {
              const strings=[];const walk=x=>{if(typeof x==='string')strings.push(x);else if(x&&typeof x==='object')Object.values(x).forEach(walk)};walk(d.result);
              console.log(strings.filter(x=>/error|missing|entry|command|deploy|assets|directory|config/i.test(x)).join('\n').slice(-12000));
            }
          }
          NODE
