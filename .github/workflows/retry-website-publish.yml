name: Retry reviewed website publication
on:
  push:
    branches: [ops/retry-travels-website-publish]
    paths: ['.github/workflows/retry-website-publish.yml']
permissions:
  contents: read
concurrency:
  group: website-production-retry
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm existing website credential
        env:
          WEBSITE_TOKEN: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
        run: test -n "$WEBSITE_TOKEN"
      - uses: actions/checkout@v4
        with:
          ref: 5380e5ca66124f604e07133219fb87696b8ddd5c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm reviewed release and gallery membership
        run: |
          test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('catalog/book-galleries.json','utf8'));
          const g=m.sections.find(s=>s.id==='watercolor-landscapes-travels');
          if(g.artworks.length!==40||g.artworks.includes('book-art-87cf2a732259b313f5ab'))throw Error('Unexpected Travels inventory');
          NODE
      - name: Publish existing website Worker from approved release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          command: deploy --config wrangler.jsonc
      - name: Confirm live Travels removal
        run: |
          node --input-type=module <<'NODE'
          let ready=false;
          for(let i=0;i<18;i++){
            const r=await fetch('https://vermillionaurora.com/book-galleries/watercolor-landscapes-travels/?verify=5380e5ca66124f604e07133219fb87696b8ddd5c-'+i,{cache:'no-store',signal:AbortSignal.timeout(15000)});
            const html=await r.text();
            const count=(html.match(/class="painting-list-row"/g)||[]).length;
            if(r.ok&&count===40&&!html.includes('book-art-87cf2a732259b313f5ab')){ready=true;console.log('Live Travels gallery verified: 40 works; Puerto Vallarta sunrise absent.');break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('Live Travels gallery still serves the previous content');
          NODE
