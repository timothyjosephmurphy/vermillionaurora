name: Retry reviewed website publication
on:
  push:
    branches: [ops/retry-travels-website-publish]
    paths: ['.github/workflows/retry-website-publish.yml']
permissions:
  contents: read
concurrency:
  group: website-production-retry
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm existing website credential
        env:
          WEBSITE_TOKEN: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
        run: test -n "$WEBSITE_TOKEN"
      - uses: actions/checkout@v4
        with:
          ref: e4267b493ea7d87954052ce16baba7fc261e44d3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm reviewed release and gallery membership
        run: |
          test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('catalog/book-galleries.json','utf8'));
          const g=m.sections.find(s=>s.id==='watercolor-landscapes-travels');
          if(!g.artworks.slice(0,11).every(id=>m.artworks.find(a=>a.id===id).title.includes('El Salvador')))throw Error('El Salvador must lead the gallery');
          if(g.artworks.some(id=>m.artworks.find(a=>a.id===id).title.includes('Untitled')))throw Error('Unclean gallery titles');
          if(g.artworks.length!==31||g.artworks.includes('book-art-87cf2a732259b313f5ab'))throw Error('Unexpected Travels inventory');
          const pacific=m.sections.find(s=>s.id==='watercolor-landscapes-pacific-north-west');
          const friends=m.sections.find(s=>s.id==='watercolor-portraits-friends');
          if(pacific.artworks.length!==8||friends.artworks[0]!=='book-art-614d5b68dbe5052e302a')throw Error('Unexpected gallery curation');
          NODE
      - name: Publish existing website Worker from approved release
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_BOOK_MEDIA_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          command: deploy --config wrangler.jsonc
      - name: Confirm live gallery and homepage changes
        run: |
          node --input-type=module <<'NODE'
          const {load}=await import('cheerio');
          let ready=false;
          for(let i=0;i<18;i++){
            try{
              const paths=['/','/book-galleries/watercolor-landscapes-pacific-north-west/','/book-galleries/watercolor-portraits-friends/','/book-galleries/watercolor-portraits-bitcoiners/','/styles.css'];
              const responses=await Promise.all(paths.map(path=>fetch('https://vermillionaurora.com'+path+'?verify=e4267b493ea7d87954052ce16baba7fc261e44d3-'+i,{cache:'no-store',signal:AbortSignal.timeout(15000)})));
              if(!responses.every(r=>r.ok))throw Error('Page request failed');
              const [home,pacific,friends,bitcoiners,css]=await Promise.all(responses.map(r=>r.text()));
              const $=load(home),p=load(pacific),f=load(friends),b=load(bitcoiners);
              const originals=['painting-chef-in-white','painting-studio-figure','painting-portrait-with-cheese'];
              const bitcoinLinks=originals.every(id=>b('.product-title-link[href="/products/'+id+'/"]').length===1&&!$('.painting-carousel [data-product-id="'+id+'"]').length);
              if($('#gallery h2').text()==='Featured Paintings'&&$('#book-galleries h2').text()==='Selected Galleries'&&p('.painting-list-row').length===8&&f('.painting-list-row').first().attr('data-product-id')==='book-art-614d5b68dbe5052e302a'&&$('a[href="/murals/berlin-el-salvador/"] img').attr('style')?.includes('object-fit:contain')&&css.includes('.book-carousel .ex-slide { flex-basis:min(260px, 82vw); }')&&bitcoinLinks){
                ready=true;console.log('Live gallery curation, originals, labels, book widths and Berlin image fit verified.');break;
              }
            }catch(error){console.log(error.message);}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('Live website still serves previous content');
          NODE
