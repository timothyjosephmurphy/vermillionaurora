name: Refresh print-sized frames
on:
  push:
    branches: [fix/print-sized-frames]
    paths: ['.github/workflows/refresh-print-frames.yml', 'payments/refresh-print-frame-quotes.mjs']
permissions:
  contents: write
concurrency:
  group: checkout-sandbox
  cancel-in-progress: false
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare catalog and verify custom frame geometry
        run: |
          npm ci
          node scripts/build-pilot-print-assets.mjs
          node scripts/build-edition-print-assets.mjs
          node payments/build-print-catalog.mjs
          node payments/build-checkout-catalog.mjs
          node --test tests/print-matting.test.mjs tests/print-framing.test.mjs cloudflare/finerworks-framing.test.mjs
      - name: Deploy quote-only frame configuration to sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          wranglerVersion: '4.143.0'
          workingDirectory: cloudflare
          command: deploy --config wrangler.sandbox.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Refresh all custom frame codes and prices without ordering
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_API_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node payments/refresh-print-frame-quotes.mjs
      - name: Generate matching frontend and checkout catalogs
        run: |
          node payments/build-print-catalog.mjs
          node payments/build-etsy-print-source.mjs
          node payments/build-checkout-catalog.mjs
          node --test tests/book-print-framing.test.mjs tests/print-matting.test.mjs tests/print-framing.test.mjs cloudflare/finerworks-framing.test.mjs
      - name: Commit exact supplier quotes to this feature branch
        run: |
          git fetch origin fix/print-sized-frames
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/prints.json catalog/book-prints.json cloudflare/print-catalog.mjs cloudflare/etsy-print-source.mjs cloudflare/checkout-catalog.mjs
          git commit -m 'Quote custom frames sized to each print with consistent mats'
          git push origin HEAD:fix/print-sized-frames
      - uses: actions/upload-artifact@v4
        with:
          name: print-frame-quotes
          path: print-frame-quotes.json
          retention-days: 3
