name: Deploy website and production checkout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm --prefix cloudflare/test ci
      - run: npm --prefix cloudflare/test test
      - name: Verify production checkout
        run: |
          node payments/build-checkout-catalog.mjs
          git diff --exit-code -- cloudflare/checkout-catalog.mjs
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc'));if(c.name!=='vermillion-commissions'||c.vars.PAYPAL_MODE!=='live')process.exit(1)"
      - name: Prepare and verify private accounting storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/prepare-sales-archive.mjs
      - name: Deploy the production Worker with the checked-in checkout settings
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          workingDirectory: cloudflare
          command: deploy --config wrangler.jsonc --var CHECKOUT_RELEASE:${{ github.sha }}
      - name: Verify the deployed production revision
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('cloudflare/wrangler.jsonc','utf8')).vars;
          const url='https://vermillion-commissions.timothyjosephmurphy.workers.dev/checkout/health';
          let ready=false;
          for(let i=0;i<30;i++){
            const r=await fetch(url);const h=await r.json().catch(()=>({}));
            if(r.ok&&h.mode==='live'&&h.release===process.env.DEPLOYED_SHA&&h.enabled===(expected.PAYPAL_CHECKOUT_ENABLED==='true')){ready=true;console.log('Production checkout health:',JSON.stringify(h));break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('The expected production revision did not become ready');
          NODE
      - name: Verify live providers without taking payment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node payments/verify-production.mjs
      - name: Deploy the generated website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c1fddf0f4f4fc9c84594757d2e1bda0
          command: deploy --config wrangler.jsonc
      - name: Verify website and API catalog versions agree
        run: node scripts/verify-release.mjs
