<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Neural Dance Live | TJ Murphy</title>
<meta name="description" content="Full-screen Neural Dance for a projector: room-music dancers, the microphone, and a Continuity Camera watching pink notes on the wall." />
<meta property="og:image" content="https://tjm.art/brand/neural-dance-share.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Neural Dance dancers on a dark stage, each wrapped in a glowing sound-wave ring" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://tjm.art/brand/neural-dance-share.jpg" />
<meta name="twitter:image:alt" content="Neural Dance dancers on a dark stage, each wrapped in a glowing sound-wave ring" />
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f4f6fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{--background:#080910;--foreground:#f4f6fb;--viz-series-1:#ff927d;--viz-series-2:#eb92f5;--viz-series-3:#7fe8b3;--viz-series-4:#81b7fc;overflow:hidden;height:100dvh}
button,select,input{font:inherit}
button{cursor:pointer}
#nd-room-lab{display:block}
#nd-room-projector{position:fixed;inset:0;z-index:1;width:100vw;height:100dvh;margin:0;background:#080910;overflow:hidden}
#nd-room-lab [data-stage]{display:block;width:100%;height:100%;background:#080910;touch-action:none}
.nd-live-chrome{position:fixed;top:0;left:0;right:0;z-index:1000003;display:flex;flex-direction:column;pointer-events:none;box-sizing:border-box;padding-top:env(safe-area-inset-top);max-height:min(46dvh, calc(100dvh - 132px - env(safe-area-inset-bottom)))}
.nd-live-bar,.nd-live-details{pointer-events:auto}
.nd-live-bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 8px;background:rgba(16,18,26,.88);border-bottom:1px solid rgba(255,255,255,.14);font-size:12px}
.nd-live-details{overflow:auto;max-height:min(34dvh, calc(100dvh - 180px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));padding:6px 8px;background:rgba(12,14,20,.92);border-bottom:1px solid rgba(255,255,255,.14);font-size:12px}
#nd-camera-mode{position:fixed;right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));z-index:1000002;width:min(216px,44vw);max-height:min(240px, calc(100dvh - 46dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));display:flex;flex-direction:column;overflow:auto;padding:6px;background:rgba(7,8,12,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;font-size:12px}
.viz-row,.viz-controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.viz-controls{align-items:end}
h1,h2{font-size:12px;margin:0 4px 0 0}
.btn,.form-select{border:1px solid rgba(255,255,255,.18);background:#171a24;color:#f4f6fb;border-radius:999px;padding:4px 8px;font-size:12px}
#nd-camera-mode .btn{padding:4px 7px;font-size:11px}
#nd-camera-mode .viz-controls{display:none}
#nd-camera-mode.is-tuned .viz-controls{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.nd-live-details .viz-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px;align-items:end}
@media (min-width:700px){.nd-live-details .viz-controls{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn-primary{background:#3158b8;border-color:#527af0}
.btn[aria-pressed="true"],.btn[data-state="listening"]{background:#1d6b45;border-color:#3dba7a}
.btn[data-state="muted"]{background:#3a3420;border-color:#c9a24a;color:#f3e2b3}
.btn[data-state="unavailable"]{border-color:#8a6070}
.btn:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #9baef0;outline-offset:3px}
.viz-controls{padding:6px;background:#10121a;border-radius:12px;margin:0}
.form-label{display:grid;gap:2px;flex:1 1 120px;min-width:0;color:#aab0c0;font-size:11px}
.mode-toggle{display:flex;gap:6px;flex-wrap:wrap}
.mode-toggle .btn{flex:1}
.form-range{width:100%;margin:0;accent-color:#81b7fc}
#nd-camera-mode .form-range{accent-color:#38bdf8}
.viz-controls output{color:#fff;font-variant-numeric:tabular-nums}
.text-small{font-size:11px;color:#aab0c0}
[data-mic]{color:#d5deff}
[data-beat]{color:#f4f6fb;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em}
[data-legend].is-hot{text-shadow:0 0 10px currentColor}
.meter{display:none;width:48px;height:5px;margin-left:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle}
#nd-room-lab[data-mic="listening"] .meter{display:inline-block}
.meter i{display:block;height:100%;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left center}
#nd-room-lab [data-spectrum]{display:block;width:100%;height:40px;background:#05060a;border-radius:10px;margin:0}
.camera-frame{position:relative;order:-1;width:100%;height:78px;min-height:72px;flex:none;background:#05060a;border-radius:10px;overflow:hidden;margin:0 0 4px}
#nd-camera-mode [data-preview],#nd-camera-mode [data-overlay]{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05060a}
#nd-camera-mode [data-overlay]{touch-action:none;cursor:crosshair}
.nd-cal-pattern{position:absolute;inset:0;z-index:4;pointer-events:none;background-color:transparent;border:8px solid #fff;background-image:linear-gradient(to right,rgba(255,255,255,.92) 2px,transparent 2px),linear-gradient(to bottom,rgba(255,255,255,.92) 2px,transparent 2px);background-size:12.5% 12.5%;background-position:center}
.nd-cal-pattern i{position:absolute;width:16%;height:22%;transform:translate(-50%,-50%);border-radius:8px;border:10px solid #000;box-shadow:0 0 0 8px #000,0 0 28px 6px #000}
[data-align-banner]{position:fixed;top:auto;right:auto;bottom:max(12px, env(safe-area-inset-bottom, 12px));left:max(12px, env(safe-area-inset-left, 12px));transform:none;z-index:1000010;pointer-events:none;opacity:0.92;max-width:min(50vw, 340px);padding:6px 12px;border-radius:999px;background:#10121a;color:#f4f6fb;font:700 13px/1.3 Inter,system-ui,sans-serif;text-align:left;box-shadow:0 12px 40px #000}
[data-align-banner][hidden]{display:none !important}
[data-debug-banner]{position:fixed;left:50%;bottom:max(12px, env(safe-area-inset-bottom, 12px));transform:translateX(-50%);z-index:1000020;display:flex;gap:8px;align-items:center;max-width:min(92vw, 640px);padding:10px 12px;border-radius:999px;background:#1a2744;color:#f4f6fb;border:1px solid #527af0;box-shadow:0 10px 30px #000}
[data-debug-banner][hidden]{display:none !important}
[data-debug-panel]{display:grid;gap:6px;margin-top:8px}
[data-debug-panel][hidden]{display:none !important}
[data-debug-code]{font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#fff}
[data-debug-link]{color:#9baef0;overflow-wrap:anywhere}
[data-align-banner][data-kind="ok"]{background:#1d6b45;color:#fff}
[data-align-banner][data-kind="warn"]{background:#8a5a12;color:#fff}
[data-align-lock-outline]{position:fixed;inset:0;width:100vw;height:100dvh;z-index:1000008;pointer-events:none}
[data-align-lock-outline][hidden]{display:none !important}
.nd-note-lock{position:absolute;z-index:6;transform:translate(-50%,-130%);padding:8px 12px;border-radius:999px;background:#3dba7a;color:#07140c;border:3px solid #ffd76a;font:700 16px/1.2 Inter,system-ui,sans-serif;pointer-events:none;white-space:nowrap}
.nd-cal-pattern [data-cal="red"]{background:#f00;left:14%;top:14%}
.nd-cal-pattern [data-cal="green"]{background:#00e5a8;left:86%;top:14%}
.nd-cal-pattern [data-cal="blue"]{background:#00f;left:86%;top:86%}
.nd-cal-pattern [data-cal="yellow"]{background:#ff0;left:14%;top:86%}
.nd-live-reveal{position:fixed;z-index:1000004;top:8px;left:8px;opacity:.7}
body.nd-live #nd-room-projector{position:fixed !important;inset:0 !important;top:0 !important;left:0 !important;width:100vw !important;height:100dvh !important;margin:0 !important;transform:none !important}
body.nd-live-collapsed .nd-live-details{display:none}
body.nd-live-hidden .nd-live-chrome{display:none}
body.nd-live-hidden #nd-camera-mode{right:auto;bottom:auto;left:0;top:0;width:320px;height:180px;max-height:none;transform:translateX(-120vw);overflow:hidden;padding:0;border:0;z-index:1}
body.nd-live-hidden #nd-camera-mode .viz-row,body.nd-live-hidden #nd-camera-mode .viz-controls,body.nd-live-hidden #nd-camera-mode .text-small{display:none}
body.nd-live-preview-off #nd-camera-mode .camera-frame{position:fixed;left:0;top:0;width:240px;height:135px;transform:translateX(-120vw);opacity:1;pointer-events:none}
body.nd-live-aligning .nd-live-chrome,body.nd-live-aligning .nd-live-reveal{display:none}
body.nd-live-aligning #nd-camera-mode{right:auto;bottom:auto;left:0;top:0;width:320px;height:180px;max-height:none;transform:translateX(-120vw);overflow:hidden;padding:0;border:0;z-index:1;pointer-events:none}
[data-cancel-align]{position:fixed;bottom:max(10px, env(safe-area-inset-bottom, 10px));left:50%;transform:translateX(-50%);z-index:40;background:#10121a;color:#aab0c0;border:1px solid rgba(255,255,255,0.16);border-radius:999px;font-size:12px;padding:5px 10px}
[data-cancel-align][hidden]{display:none !important}
@media (max-height:520px){
  h2{font-size:11px}
  .nd-live-bar{gap:4px;padding:3px 6px}
  .nd-live-details{max-height:28dvh}
  #nd-room-lab [data-spectrum]{height:32px}
  .camera-frame{height:72px}
}
</style>
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="manifest" href="/neural-dance/live/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neural Dance" />
    <meta name="theme-color" content="#070a12" />
    <script>
      if (window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
        document.documentElement.classList.add('nd-standalone');
      }
    </script>
    <link rel="stylesheet" href="/neural-dance/standalone.css" />

</head>
<body class="nd-live nd-live-collapsed">
<div id="nd-live-toast" data-align-banner hidden></div>
<div data-debug-banner hidden><span data-debug-banner-text>Suggested tuning received</span><button class="btn btn-primary" type="button" data-debug-apply>Apply</button><button class="btn" type="button" data-debug-dismiss>Dismiss</button></div>
<svg data-align-lock-outline hidden viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="6,6 94,6 94,94 6,94" fill="none" stroke="#3dff9a" stroke-width="1.6"></polygon></svg>
<h1 class="nd-live-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Neural Dance live</h1>
<section id="nd-room-lab" data-mic="off" aria-labelledby="room-music-title">
  <div id="nd-room-projector"><canvas class="cursor-interaction" data-add-dancer data-stage width="1000" height="620" role="img" aria-label="Room-music dancers. They move when the microphone hears a kick, bass, snare, or hi-hat."></canvas><div class="nd-cal-pattern" data-cal-pattern hidden><i data-cal="red"></i><i data-cal="green"></i><i data-cal="blue"></i><i data-cal="yellow"></i></div></div>
  <div class="nd-live-chrome">
  <div id="nd-live-dock" class="nd-live-bar">
      <h2 id="room-music-title">Room music</h2>
      <button class="btn btn-primary" type="button" data-action="play">Start</button>
      <button class="btn" type="button" data-action="listen" data-state="off" aria-pressed="false">Listen</button>
      <button class="btn" type="button" data-action="align" aria-pressed="false">Align projector</button>
      <button class="btn" type="button" data-action="sim-dancers" data-sim-clear aria-pressed="true">Clear sim dancers</button>
      <button class="btn" type="button" data-camera-flip>Flip camera</button>
      <button class="btn" type="button" data-live="exit-align" hidden>Exit align</button>
      <button class="btn" type="button" data-live="fullscreen">Fullscreen</button>
      <button class="btn" type="button" data-live="collapse" aria-expanded="false">Show controls</button>
      <button class="btn" type="button" data-live="hide">Hide controls</button>
      <button class="btn" type="button" data-live="preview" aria-pressed="true">Preview</button>
      <span data-mic role="status" aria-live="polite">Mic off</span>
      <span data-beat role="status">120 BPM · 1</span>
      <span data-status role="status" aria-live="polite">Loading room music…</span>
  </div>
    <div class="nd-live-details" data-live-details>
      <div class="viz-controls" data-add-dancer>
        <label class="form-label">New dancer<select class="form-select" data-control="type"><option value="0">Kick</option><option value="1" selected>Bass</option><option value="2">Snare</option><option value="3">Hi-hat</option></select></label>
        <label class="form-label">Gravity <output data-value="gravity">2.5×</output><input class="form-range" data-control="gravity" type="range" min="0" max="6" step="0.1" value="2.5" aria-label="Gravity"></label>
        <label class="form-label">Wander <output data-value="wander">0.25</output><input class="form-range" data-control="wander" type="range" min="0" max="0.8" step="0.05" value="0.25" aria-label="Wander"></label>
        <label class="form-label">Threshold <output data-value="threshold">1.40</output><input class="form-range" data-control="threshold" type="range" min="1" max="1.9" step="0.05" value="1.4" aria-label="Threshold"></label>
        <label class="form-label">Peak hold <output data-value="peak">2.8 s</output><input class="form-range" data-control="peak" type="range" min="1" max="6" step="0.1" value="2.8" aria-label="Peak hold"></label>
        <label class="form-label">Kick sensitivity <output data-value="sens-0">1.00×</output><input class="form-range" data-control="sens" data-band="0" type="range" min="0" max="3" step="0.05" value="1" aria-label="Kick sensitivity"></label>
        <label class="form-label">Bass sensitivity <output data-value="sens-1">1.00×</output><input class="form-range" data-control="sens" data-band="1" type="range" min="0" max="3" step="0.05" value="1" aria-label="Bass sensitivity"></label>
        <label class="form-label">Snare sensitivity <output data-value="sens-2">1.00×</output><input class="form-range" data-control="sens" data-band="2" type="range" min="0" max="3" step="0.05" value="1" aria-label="Snare sensitivity"></label>
        <label class="form-label">Hi-hat sensitivity <output data-value="sens-3">1.00×</output><input class="form-range" data-control="sens" data-band="3" type="range" min="0" max="3" step="0.05" value="1" aria-label="Hi-hat sensitivity"></label>
        <label class="form-label">Quiet threshold <output data-value="quiet">0.08</output><input class="form-range" data-control="quiet" type="range" min="0" max="0.4" step="0.01" value="0.08" aria-label="Quiet threshold"></label>
        <button class="btn" type="button" data-action="sim-seed">Seed 24 sim dancers</button>
      </div>
      <canvas data-spectrum width="880" height="96" aria-label="Live microphone levels for kick, bass, mid, and treble"></canvas>
      <div class="viz-row text-small"><span data-legend="0">● Kick<span class="meter"><i data-meter="0"></i></span></span><span data-legend="1">◆ Bass<span class="meter"><i data-meter="1"></i></span></span><span data-legend="2">■ Mid<span class="meter"><i data-meter="2"></i></span></span><span data-legend="3">▲ Treble<span class="meter"><i data-meter="3"></i></span></span><span data-floor>noise floor —</span></div>
    </div>
  </div>
</section>
<section id="nd-camera-mode" data-fine-tune="1" aria-labelledby="camera-mode-title">
  <div class="viz-row"><h2 id="camera-mode-title">Camera</h2><button class="btn btn-primary" type="button" data-action="camera">Use camera</button><button class="btn" type="button" data-camera-flip>Flip camera</button><button class="btn" type="button" data-action="refresh">Refresh cameras</button><button class="btn" type="button" data-action="calibrate" aria-pressed="false">Fine-tune corners</button><button class="btn" type="button" data-action="markers" aria-pressed="false" disabled>Markers off</button><button class="btn" type="button" data-marker-clear>Clear markers</button><button class="btn" type="button" data-marker-reset>Reset defaults</button><button class="btn" type="button" data-camera-tune aria-pressed="false" aria-expanded="false">Tune</button></div>
  <div class="camera-frame"><video data-preview autoplay muted playsinline aria-label="Live camera preview"></video><canvas data-overlay aria-hidden="true"></canvas></div>
  <div class="viz-row">
    <button class="btn" type="button" data-debug-share aria-pressed="false">Share live debug</button>
    <label class="text-small"><input type="checkbox" data-debug-auto checked> Auto-apply live tuning</label>
  </div>
  <div data-debug-panel hidden>
    <p class="text-small">Room <strong data-debug-code></strong> <a data-debug-link href="/neural-dance/debug/">Viewer</a></p>
    <p class="text-small"><button class="btn" type="button" data-debug-copy>Copy viewer link</button> <span data-debug-status role="status"></span></p>
  </div>
  <label class="form-label">Camera<select class="form-select" data-control="device" aria-label="Camera"><option value="">Choose a camera</option></select></label>
  <div class="viz-controls">
    <div class="form-label">Track
      <div class="mode-toggle" role="group" aria-label="Track">
        <button class="btn" type="button" data-mode="both" aria-pressed="true">Both</button>
        <button class="btn" type="button" data-mode="pink" aria-pressed="false">Pink notes</button>
        <button class="btn" type="button" data-mode="stickers" aria-pressed="false">Dancer stickers</button>
      </div>
    </div>
    <label class="form-label">Hue range (higher = wider color match) <output data-value="hue">32°</output><input class="form-range" data-control="hue" type="range" min="18" max="80" step="1" value="32" aria-label="Hue range (higher = wider color match)"></label>
    <label class="form-label">Note sensitivity (higher = fainter notes) <output data-value="sat">0.45</output><input class="form-range" data-control="sat" type="range" min="0.25" max="1" step="0.01" value="0.45" aria-label="Note sensitivity (higher = fainter notes)"></label>
    <label class="form-label">Smallest note size (lower = detects smaller notes) <output data-value="size">22 px</output><input class="form-range" data-control="size" type="range" min="4" max="200" step="1" value="22" aria-label="Smallest note size (lower = detects smaller notes)"></label>
    <label class="form-label">Sticker sensitivity (higher = fainter stickers) <output data-value="sticker">0.50</output><input class="form-range" data-control="sticker" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Sticker sensitivity (higher = fainter stickers)"></label>
  </div>
  <p class="text-small" data-status role="status" aria-live="polite">Camera off</p>
</section>
<button class="btn nd-live-reveal" type="button" data-live="reveal" hidden>Controls</button>
<button class="btn" type="button" data-cancel-align hidden>Cancel align</button>
<script src="/neural-dance/vendor/maptastic.js"></script>
<script src="/neural-dance/silence-gate.js"></script>
<script src="/neural-dance/wave-ring.js"></script>
<script type="module" src="/neural-dance/room-lab.js"></script>
<script type="module" src="/neural-dance/camera-markers.js"></script>
<script type="module" src="/neural-dance/live-show.js"></script>
<script type="module" src="/neural-dance/live-debug.js"></script>
</body>
</html>
