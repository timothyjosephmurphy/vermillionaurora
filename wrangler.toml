name = "vermillion-neural-dance"
main = "worker/index.mjs"
compatibility_date = "2026-09-29"
account_id = "3c1fddf0f4f4fc9c84594757d2e1bda0"

[assets]
directory = "./dist/assets"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [ "/api/neural-dance/debug/*" ]

[durable_objects]
bindings = [
  { name = "NEURAL_DANCE_DEBUG", class_name = "NeuralDanceDebugRoom" }
]

[[migrations]]
tag = "neural-dance-debug-v1"
new_sqlite_classes = [ "NeuralDanceDebugRoom" ]
